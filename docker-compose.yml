services:
  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    container_name: invest_backend
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
      - ./stock_industry_base.csv:/app/stock_industry_base.csv
      - ./market_enriched.csv:/app/market_enriched.csv
      # 注意：market.db / user_data.db 统一放在 ./data/ 目录下，
      # 以目录形式挂载，保证 SQLite WAL/SHM 文件与主库始终在同一卷中，
      # 避免容器重建时丢失未 checkpoint 的写入。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      - ts_token=${ts_token:-}
      - SINGLE_USER_MODE=${SINGLE_USER_MODE:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - TZ=${TZ:-Asia/Shanghai}
      # AI 简报走工作站 sglang（经 Mac 上的 SSH 隧道 127.0.0.1:18100）
      - SGLANG_BASE_URL=${SGLANG_BASE_URL:-http://host.docker.internal:18100}
      - SGLANG_MODEL=${SGLANG_MODEL:-qwen}
    dns:
      - 114.114.114.114
      - 223.5.5.5
    restart: always

  frontend:
    build:
      context: .
      dockerfile: web/frontend/Dockerfile
    container_name: invest_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always
