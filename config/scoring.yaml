version: 2
universe:
  base_file: stock_industry_base.csv
  enriched_file: market_enriched.csv
  db_path: market.db
positives:
  weights:
    pb: 0.4
    pe_ttm: 0.4
    distance_from_1y_low: 0.2
  pb:
    field: pb
    direction: lower_better
    industry_field_for_anchor: anchor_industry
    anchor_default: 1.0
    tiers_mode: additive
    tiers:
    - delta: 0.0
      score: 100
    - delta: 0.1
      score: 90
    - delta: 0.2
      score: 75
    - delta: 0.4
      score: 55
    - else: 25
    anchors_by_industry:
      公路铁路: 0.5
      水务: 0.7
      电力: 0.8
      化纤: 0.8
      基础建设: 0.5
      房屋建设: 0.5
      房地产开发: 0.5
      工程机械: 0.8
      焦炭加工: 0.5
      煤炭开采: 0.5
      家居用品: 0.9
      造纸: 0.6
      冶钢原料: 0.5
      普钢: 0.5
      特钢: 0.5
      全国性银行: 0.5
      地方性银行: 0.5
  pe_ttm:
    field: pe_ttm
    direction: lower_better
    ignore_if_le_zero: true
    industry_field_for_anchor: anchor_industry
    anchor_default: 8
    tiers_mode: additive
    tiers:
    - delta: 0
      score: 100
    - delta: 2
      score: 90
    - delta: 4
      score: 75
    - delta: 8
      score: 55
    - else: 25
    anchors_by_industry:
      煤炭: 5
      电力: 8
      钢铁-普钢: 4
      钢铁-钢加工: 7
      化纤: 8
      化工: 7
      建材: 5
      造纸: 8
      矿物制品: 10
      日用化工: 10
      农林牧渔: 10
      纺织服饰: 8
      服饰: 6
      酿酒: 10
      医疗保健: 10
      家居用品: 8
      医药: 10
      商业连锁: 8
      商贸代理: 7
      传媒娱乐: 7
      广告包装: 10
      文教休闲: 10
      酒店餐饮: 10
      旅游: 10
      运输设备: 9
      通用机械: 10
      工业机械: 9
      电气设备: 10
      工程机械: 8
      公共交通: 8
      水务: 8
      供气供热: 10
      银行: 5
      全国性银行: 5
      国有大型银行: 5
      地方性银行: 5
      城商行: 5
      农商行: 5
      股份制银行: 5
      房地产开发: 6
      高速公路: 9
  distance_from_1y_low:
    field: rise_from_1y_low_pct
    direction: lower_better
    buckets:
    - max: 3
      score: 100
    - max: 6
      score: 90
    - max: 10
      score: 75
    - max: 20
      score: 50
    - else: 25
negatives:
  treat_missing_as_pass: false
  debt_ratio:
    source_file: risk_basics.csv
    field_pct: debt_ratio_pct
    by_industry_field: tdx_l1
    condition: below_industry_median
  goodwill_intangibles:
    field_pct: goodwill_intangibles_pct
    max_pct: 30
  controller_pledge:
    field_pct: controller_pledge_pct
    max_pct: 30
major_events:
  source_file: risk_basics.csv
  st_flag_field: st_flag
  major_flag_field: major_event_flag
  keywords:
  - 退市
  - 造假
  - 资金占用
  - 无法表示意见
  - 否定意见
  - 违规担保
  - 控制权争夺
exclusions:
  min_price: 0
  min_market_cap: 0
  exclude_if_st_in_name: true
outputs:
  min_total_score: 70
  file_scored: scored_candidates.csv
  file_three_pos: three_positives_table.csv
  file_rejected: rejected_with_reasons.csv
